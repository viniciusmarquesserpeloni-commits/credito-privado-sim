# Publica o site a cada push na main, com dados públicos coletados na hora.
# Reaproveita o mesmo fluxo do update-data.yml (coleta -> testes -> build -> deploy), sem commit.
name: Site (GitHub Pages)

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  site:
    uses: ./.github/workflows/update-data.yml
