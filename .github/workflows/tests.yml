# Testes do núcleo + CI de privacidade (regra 4). Roda em todo push e pull request.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Privacidade (falha se houver dado real ou marcação interna)
        run: pytest tests/test_privacy.py -v

      - name: Testes e cobertura do núcleo
        run: pytest --cov=cpsim --cov-report=term-missing
