# Regra 8: telemetria do Streamlit desligada.
[browser]
gatherUsageStats = false

[server]
# Uploads ficam só em memória; limite generoso para PDFs de várias páginas.
maxUploadSize = 50

[client]
toolbarMode = "viewer"

[theme]
# Cores do painel "Relatório de Fundos" (petróleo + verde-lima).
base = "light"
primaryColor = "#0e2a33"
backgroundColor = "#f4f5f2"
secondaryBackgroundColor = "#ffffff"
textColor = "#0e2a33"
