[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cpsim"
version = "0.0.1"
description = "Simulador de trocas em crédito privado (núcleo analítico; roda também no navegador via stlite)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Versões iguais às da distribuição Pyodide do stlite fixado em web/index.html (1.12.0),
# para que o resultado local e no navegador seja o mesmo.
# Sem scipy (decisão da Fase 0): custa ~10–20 s no carregamento; raízes em Python puro.
dependencies = [
  "numpy==2.4.3",
  "pandas==3.0.2",
  "openpyxl==3.1.5",
  "pypdf==6.21.4",
]

[project.optional-dependencies]
dev = [
  "streamlit==1.65.0",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "fpdf2==2.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["cpsim"]
